sources:
  - name: customers_csv
    type: file
    file_path: data/raw/customers.csv
    key_field: customer_id
    schema:
      - field: customer_id
        dtype: int
      - field: name
        dtype: str
      - field: email
        dtype: str
      - field: signup_date
        dtype: str


  - name: users_api
    type: api
    url: https://jsonplaceholder.typicode.com/users
    timeout: 10
    key_field: id
    schema:
      - field: id
        dtype: int
      - field: name
        dtype: str
      - field: email
        dtype: str


  - name: orders_stream
    type: pubsub
    subscription_id: orders-events-sub
    max_messages: 10
    key_field: order_id